services:

  # ======================================================
  # MYSQL
  # ======================================================

  mysql:
    image: mysql:8.4
    container_name: shopsphere-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - shopsphere-network


  # ======================================================
  # KAFKA
  # ======================================================

  kafka:
    image: apache/kafka:4.3.1
    container_name: shopsphere-kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - shopsphere-network


  # ======================================================
  # RABBITMQ
  # ======================================================

  rabbitmq:
    image: rabbitmq:4-management
    container_name: shopsphere-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - shopsphere-network


  # ======================================================
  # USER SERVICE
  # ======================================================

  user-service:

    build:
      context: ./user-service

    container_name: shopsphere-user-service

    ports:
      - "8081:8081"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      JWT_EXPIRATION: 3600000

    depends_on:

      mysql:
        condition: service_healthy

    networks:
      - shopsphere-network


  # ======================================================
  # PRODUCT SERVICE
  # ======================================================

  product-service:

    build:
      context: ./productservice

    container_name: shopsphere-product-service

    ports:
      - "8082:8082"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/products_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      AWS_REGION: ca-central-1

      AWS_S3_BUCKET_NAME: shopsphere-product-images-karan-2026

    depends_on:

      mysql:
        condition: service_healthy

    networks:
      - shopsphere-network


  # ======================================================
  # ORDER SERVICE
  # ======================================================

  order-service:

    build:
      context: ./order-service

    container_name: shopsphere-order-service

    ports:
      - "8083:8083"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      SERVICES_USER_URL: http://user-service:8081

      SERVICES_PRODUCT_URL: http://product-service:8082

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:

      mysql:
        condition: service_healthy

      user-service:
        condition: service_started

      product-service:
        condition: service_started

      kafka:
        condition: service_started

    networks:
      - shopsphere-network


  # ======================================================
  # NOTIFICATION SERVICE
  # ======================================================

  notification-service:

    build:
      context: ./notificationservice

    container_name: shopsphere-notification-service

    ports:
      - "8084:8084"

    environment:

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_RABBITMQ_HOST: rabbitmq

      SPRING_RABBITMQ_PORT: 5672

      SPRING_RABBITMQ_USERNAME: guest

      SPRING_RABBITMQ_PASSWORD: guest

      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}

      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

    depends_on:

      kafka:
        condition: service_started

      rabbitmq:
        condition: service_started

    networks:
      - shopsphere-network


  # ======================================================
  # API GATEWAY
  # ======================================================

  api-gateway:

    build:
      context: ./api-gateway

    container_name: shopsphere-api-gateway

    ports:
      - "8080:8080"

    environment:

      SERVICES_USER_URL: http://user-service:8081

      SERVICES_PRODUCT_URL: http://product-service:8082

      SERVICES_ORDER_URL: http://order-service:8083

      JWT_SECRET: ${JWT_SECRET}

    depends_on:

      user-service:
        condition: service_started

      product-service:
        condition: service_started

      order-service:
        condition: service_started

    networks:
      - shopsphere-network


# ========================================================
# VOLUMES
# ========================================================

volumes:

  mysql-data:


# ========================================================
# NETWORK
# ========================================================

networks:

  shopsphere-network:
    driver: bridge 
