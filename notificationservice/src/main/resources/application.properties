spring.application.name=notificationservice

server.port=8084

# ===============================
# KAFKA
# ===============================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notificationservice-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.shopsphere.notificationservice.event.OrderCreatedEvent

kafka.topic.order-created=order-created


# ===============================
# RABBITMQ
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.notification=notification-exchange
rabbitmq.queue.email=email-notification-queue
rabbitmq.routing-key.email=email.notification


# ===============================
# EMAIL
